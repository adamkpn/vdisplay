[package]
name = "vdisplay"
version = "0.1.1"
edition = "2021"
description = "Run any macOS app on a virtual display of any resolution and show it in part of your screen"
license = "MIT"
repository = "https://github.com/adamkpn/vdisplay"
homepage = "https://github.com/adamkpn/vdisplay"
readme = "README.md"
keywords = ["macos", "virtual-display", "fullscreen", "screen", "cli"]
categories = ["command-line-utilities", "os::macos-apis"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
