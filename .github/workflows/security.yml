# Security scans behind the README badge: `make security`, which runs
#   cargo audit  dependency advisories (RustSec)
#   Trivy        dependency CVEs, hardcoded secrets, misconfigurations
#   Gitleaks     credentials in the whole git history and the working tree
#   scan-private home paths and e-mail addresses in tracked files
# On every push to main and pull request, weekly (new advisories appear
# without any change here), and from release.yml before anything is published.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  workflow_call:

permissions: {}

env:
  CARGO_AUDIT_VERSION: "0.22.2"

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Gitleaks scans every commit, not just the last one.
          fetch-depth: 0

      # Compiling cargo-audit takes ~3 minutes; the scans themselves ~20 s.
      # Keyed on the version, so a version bump builds it once again.
      # (Release builds are deliberately not cached: their binaries are
      # always compiled from source.)
      - name: Restore cargo-audit
        id: cargo-audit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ env.CARGO_AUDIT_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-audit
        if: steps.cargo-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version "$CARGO_AUDIT_VERSION"

      - name: Scan
        run: make security
